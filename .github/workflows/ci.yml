name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # Both files: requirements_dev.txt only `-r requirements.txt`, so
          # keying on it alone leaves the cache stale when a pin moves there.
          cache-dependency-path: |
            requirements.txt
            requirements_dev.txt
      - run: pip install -r requirements_dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cutter
          POSTGRES_PASSWORD: cutter
          # tests/conftest.py truncates every table between tests, so it must
          # never point at a database that could hold real data. The suite is
          # wired to this name specifically.
          POSTGRES_DB: cutter_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cutter -d cutter_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://cutter:cutter@localhost:5432/cutter_test_db
      TEST_DATABASE_URL: postgresql://cutter:cutter@localhost:5432/cutter_test_db
      # bcrypt's cost is deliberate; 4 rounds still produces valid hashes and
      # keeps the fixtures from dominating the run.
      BCRYPT_ROUNDS: "4"
      # Keeps SECRET_KEY optional (it is mandatory only when production).
      ENVIRONMENT: local

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # Both files: requirements_dev.txt only `-r requirements.txt`, so
          # keying on it alone leaves the cache stale when a pin moves there.
          cache-dependency-path: |
            requirements.txt
            requirements_dev.txt

      # Some tests render the cutting diagram through Pillow, which needs a
      # TrueType font. The runner image does not ship one by default.
      - name: Install DejaVu fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - run: pip install -r requirements_dev.txt

      # The native packing kernel (rust/). It is a byte-identical port of the
      # interpreted geometry, so the suite passes with or without it — but the
      # build that ships HAS it, so CI must exercise that path. The runner
      # already carries a Rust toolchain; only maturin is missing.
      - name: Build the native packing kernel
        run: |
          pip install maturin==1.7.8
          maturin build --release --manifest-path rust/Cargo.toml \
            --compatibility linux --out dist
          pip install --no-deps dist/*.whl

      # No Redis service: tests/conftest.py substitutes an in-memory double.
      # pyproject.toml enforces --cov-fail-under=80, so the whole suite runs,
      # not just `-m unit`.
      #
      # `benchmark` is excluded on purpose: those tests pin the exact board
      # count of the audit cut lists against the commercial program — a
      # commercial claim, only meaningful for the build that ships — and they
      # take ~2 min. `make benchmark` runs them against that build (linux/amd64).
      # They are NOT excluded for being build-dependent: CP-SAT's arbitrary pick
      # among equally optimal packings used to leak into the layout (arm64 and
      # x86_64 disagreed on pre-order 21 at kerf 5), but canonical
      # reconstruction fixed that, and a 12-way tie-break sweep now guards it.
      # A red benchmark today is a real regression, not a platform difference.
      - run: pytest -q -m "not benchmark"

      # The pure-Python geometry is the oracle and the fallback for any box
      # without the wheel, so it cannot be allowed to rot behind the kernel.
      # Only the cutting layer is re-run: nothing else changes with the backend.
      - name: Re-run the cutting suite on the Python fallback
        env:
          OPT_ENGINE_BACKEND: python
        run: pytest -q --no-cov tests/test_cutting.py tests/unit/test_cutting_search.py
